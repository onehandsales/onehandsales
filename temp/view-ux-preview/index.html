<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>OneHand CRM · 5개 워크스페이스 UX 미리보기</title>
  <meta name="description" content="영업, 부동산, 마케팅, 보험·금융, 커머스의 고객관리 업무를 11가지 보기로 체험하는 OneHand CRM UX 목업입니다.">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app" class="app-shell">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="main-shell">
      <header id="page-header" class="page-header"></header>
      <div id="view-bar" class="view-bar"></div>
      <div id="toolbar" class="toolbar"></div>
      <section id="workspace" class="workspace" aria-label="업무 기록"></section>
      <footer id="status-bar" class="status-bar"></footer>
    </main>
  </div>
  <div id="popover-root"></div>
  <div id="detail-root"></div>
  <dialog id="dialog" class="modal"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script defer src="./workspace-data.js"></script>
  <script defer src="./icons.js"></script>
  <script defer src="./model.js"></script>
  <script defer src="./ui-helpers.js"></script>
  <script defer src="./views.js"></script>
  <script defer src="./app.js"></script>
</body>
</html>
